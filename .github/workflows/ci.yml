name: Miniflux configuration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3

      - name: Validate private runtime configuration
        run: |
          POSTGRES_PASSWORD="$(openssl rand -hex 24)"
          export POSTGRES_PASSWORD
          export MINIFLUX_BASE_URL="https://miniflux.example.invalid"
          node tests/security-config.test.mjs
          docker compose config --quiet

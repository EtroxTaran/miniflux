name: Task / Chore / Refactor / Docs
description: Technical task that isn't a user-facing feature or bug
title: "chore: "
labels:
  - task
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        # Task

        Für Refactor, Chore, Docs, Infra, Tech-Debt. Für user-facing Features → feature.yml.
        Gherkin-AC ist auch hier bevorzugt, Tasklist als Fallback bei rein technischen Tasks.
        Dependencies/Sub-Issues in GitHub setzen; die Felder unten sind der maschinenlesbare Fallback.

  - type: textarea
    id: what_and_why
    attributes:
      label: What & Why
      description: "Was soll getan werden und warum? Welches Problem löst es?"
      placeholder: "Upgrade Node 22 → 24 ... weil LTS Cutoff ..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: "Gherkin bevorzugt. Für rein technische Tasks (keine Verhaltensänderung) ist eine Tasklist akzeptabel."
      value: |
        ```gherkin
        Scenario: <Kurztitel>
          Given <Ausgangszustand>
          When <technische Aktion>
          Then <Zielzustand>
        ```

        oder (nur bei rein technischen Tasks ohne Verhaltensänderung):

        - [ ] Schritt 1
        - [ ] Schritt 2
        - [ ] Schritt 3
    validations:
      required: true

  - type: textarea
    id: definition_of_done
    attributes:
      label: Definition of Done
      value: |
        - [ ] Änderung umgesetzt und lokal verifiziert
        - [ ] Tests wo sinnvoll (bei Refactor: bestehende Tests grün)
        - [ ] Docs aktualisiert (README / AGENTS.md / ADR, wenn relevant)
        - [ ] Dependencies/Sub-Issues in GitHub gepflegt oder explizit "None"
        - [ ] PR mit `Closes #<this>` verlinkt
        - [ ] AI-Review-Pipeline: all required stages green oder dokumentierter HITL-Entscheid
        - [ ] Reporting-Check grün (`ai-review issue-report`)
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Backlog Dependencies
      description: "GitHub native Dependencies/Sub-Issues sind Source of Truth. Hier zusätzlich maschinenlesbar spiegeln."
      value: |
        Depends on:
        - None

        Blocks:
        - None
    validations:
      required: true

  - type: textarea
    id: operational_impact
    attributes:
      label: Operational Impact
      description: "Runner, n8n, MCP, docs, bootstrap, security, deployment oder migration impact."
      value: |
        - Runtime impact:
        - n8n/MCP impact:
        - Security impact:
        - Rollback:
    validations:
      required: true

  - type: input
    id: priority
    attributes:
      label: Priority
      description: "P0 (critical), P1 (high), P2 (medium), P3 (low)"
      value: P3
    validations:
      required: false

  - type: input
    id: estimate
    attributes:
      label: Estimate
      description: "XS (<1h), S (<4h), M (<1d), L (<3d), XL (>3d)"
      value: S
    validations:
      required: false
